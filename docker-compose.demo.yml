# A throwaway instance for trying the site out. Needs no .env and no editing:
#
#   docker compose -f docker-compose.demo.yml up
#
# Then open http://localhost:8080 and log in with "demo".
# Everything lives in memory, so stopping the container wipes it.
services:
  demo:
    # Use the published image when it can be fetched, and fall back to building
    # from this checkout when it cannot. Add --build to force a local build.
    image: ghcr.io/mikaelo/booking.rudbeckia.nu:latest
    build: .
    pull_policy: missing
    container_name: booking-rudbeckia-demo
    ports:
      - "8080:8080"
    environment:
      DEMO: "true"
      BASE_URL: http://localhost:8080
    tmpfs:
      # A RAM-backed database, so every start is a clean house.
      - /data:uid=65532,gid=65532
